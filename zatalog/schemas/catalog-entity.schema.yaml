$schema: http://json-schema.org/draft-07/schema#
$id: https://github.com/vivainio/zatalog/schema/catalog-entity
title: Zatalog catalog entity
type: object
required: [apiVersion, kind, metadata]
additionalProperties: false
properties:
  apiVersion: {type: string, minLength: 1}
  kind: {type: string, minLength: 1}
  metadata:
    type: object
    required: [name]
    additionalProperties: true
    properties:
      name:
        type: string
        minLength: 1
        maxLength: 63
        pattern: '^[a-zA-Z0-9]+(?:[-_.][a-zA-Z0-9]+)*$'
      namespace:
        type: string
        minLength: 1
        maxLength: 63
        pattern: '^[a-zA-Z0-9]+(?:-[a-zA-Z0-9]+)*$'
      title: {type: string, minLength: 1}
      description: {type: string}
      labels:
        type: object
        additionalProperties: {type: string}
      annotations:
        type: object
        additionalProperties: {type: string}
      tags:
        type: array
        items: {type: string, minLength: 1, maxLength: 63}
      links:
        type: array
        items:
          type: object
          required: [url]
          properties:
            url: {type: string, minLength: 1}
            title: {type: string, minLength: 1}
            icon: {type: string, minLength: 1}
            type: {type: string, minLength: 1}
  spec: {type: object}
  relations: {type: array}
  status: {type: object}
allOf:
  - if: {properties: {kind: {const: Component}}}
    then:
      required: [spec]
      properties:
        apiVersion: {const: backstage.io/v1alpha1}
        spec:
          type: object
          required: [type, lifecycle, owner]
          properties:
            type: {type: string, minLength: 1}
            lifecycle: {type: string, minLength: 1}
            owner: {$ref: '#/$defs/reference'}
            system: {$ref: '#/$defs/reference'}
            subcomponentOf: {$ref: '#/$defs/reference'}
            providesApis: {$ref: '#/$defs/references'}
            consumesApis: {$ref: '#/$defs/references'}
            dependsOn: {$ref: '#/$defs/references'}
  - if: {properties: {kind: {const: API}}}
    then:
      required: [spec]
      properties:
        apiVersion: {enum: [backstage.io/v1alpha1, backstage.io/v1beta1]}
        spec:
          type: object
          required: [type, lifecycle, owner]
          properties:
            type: {type: string, minLength: 1}
            lifecycle: {type: string, minLength: 1}
            owner: {$ref: '#/$defs/reference'}
            system: {$ref: '#/$defs/reference'}
          allOf:
            - if: {properties: {type: {const: mcp-server}}, required: [type]}
              then: {required: [remotes]}
              else: {required: [definition]}
  - if: {properties: {kind: {const: Resource}}}
    then:
      required: [spec]
      properties:
        apiVersion: {const: backstage.io/v1alpha1}
        spec:
          type: object
          required: [type, owner]
          properties:
            type: {type: string, minLength: 1}
            owner: {$ref: '#/$defs/reference'}
            system: {$ref: '#/$defs/reference'}
            dependsOn: {$ref: '#/$defs/references'}
  - if: {properties: {kind: {enum: [System, Domain]}}}
    then:
      required: [spec]
      properties:
        apiVersion: {const: backstage.io/v1alpha1}
        spec:
          type: object
          required: [owner]
          properties:
            owner: {$ref: '#/$defs/reference'}
            domain: {$ref: '#/$defs/reference'}
            subdomainOf: {$ref: '#/$defs/reference'}
  - if: {properties: {kind: {const: Group}}}
    then:
      required: [spec]
      properties:
        apiVersion: {const: backstage.io/v1alpha1}
        spec:
          type: object
          required: [type, children]
          properties:
            type: {type: string, minLength: 1}
            parent: {$ref: '#/$defs/reference'}
            children: {$ref: '#/$defs/references'}
            members: {$ref: '#/$defs/references'}
  - if: {properties: {kind: {const: User}}}
    then:
      required: [spec]
      properties:
        apiVersion: {const: backstage.io/v1alpha1}
        spec:
          type: object
          required: [memberOf]
          properties:
            memberOf: {$ref: '#/$defs/references'}
  - if: {properties: {kind: {const: Location}}}
    then:
      required: [spec]
      properties:
        apiVersion: {const: backstage.io/v1alpha1}
        spec:
          type: object
          properties:
            type: {type: string, minLength: 1}
            target: {type: string, minLength: 1}
            targets: {type: array, items: {type: string, minLength: 1}}
            presence: {enum: [required, optional]}
  - if: {properties: {kind: {const: Template}}}
    then:
      required: [spec]
      properties:
        apiVersion: {enum: [backstage.io/v1beta2, scaffolder.backstage.io/v1beta3]}
        spec:
          type: object
          required: [type, owner, parameters, steps]
          properties:
            type: {type: string, minLength: 1}
            owner: {$ref: '#/$defs/reference'}
            parameters: {type: array}
            steps: {type: array}
$defs:
  reference: {type: string, minLength: 1}
  references:
    type: array
    items: {$ref: '#/$defs/reference'}
